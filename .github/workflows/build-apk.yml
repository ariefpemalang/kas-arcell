name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK Platform 36
        run: |
          sudo chown -R runner:runner $ANDROID_HOME
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36"

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/BUKU-ARcell.apk

      - name: Upload Debug APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BUKU-ARcell-APK
          path: android/app/build/outputs/apk/debug/BUKU-ARcell.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: latest
          name: BUKU ARcell Mobile APK (Latest)
          body: |
            ## 📱 BUKU ARcell Mobile APK

            Aplikasi Android BUKU ARcell — kasir & pembukuan toko HP konter.

            ### ✅ Cara Install
            1. Download file `BUKU-ARcell.apk` di bawah
            2. Pindahkan ke HP Android
            3. Buka file APK → Install
            4. Izinkan "Install dari sumber tidak dikenal" jika diminta

            ### 📋 Info
            - **Package:** `com.kasarcell.app`
            - **Min Android:** Android 7.0 (API 24)
            - **Target Android:** Android 15 (API 35)
            - **Build:** Debug
          files: android/app/build/outputs/apk/debug/BUKU-ARcell.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
