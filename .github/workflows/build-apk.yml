name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets & Sync Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/KAS-ARcell.apk

      - name: Upload Debug APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KAS-ARcell-APK
          path: android/app/build/outputs/apk/debug/KAS-ARcell.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: latest
          name: KAS ARcell Mobile APK (Latest)
          body: |
            ## 📱 KAS ARcell Mobile APK
            Aplikasi Android APK KAS ARcell siap langsung di-install pada smartphone Android.
            
            - **Versi:** 1.0.0
            - **Package:** `com.kasarcell.app`
            - **Arsitektur:** Universal (mendukung semua HP Android)
          files: android/app/build/outputs/apk/debug/KAS-ARcell.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
